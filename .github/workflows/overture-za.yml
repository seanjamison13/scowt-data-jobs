name: Overture South Africa prospects

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "count = report totals only; load = send businesses to Scowt's Supabase"
        type: choice
        options: [count, load]
        default: count
      release:
        description: "Overture release"
        default: "2026-09-23.1"
      min_confidence:
        description: "Skip places below this Overture confidence (0-1)"
        default: "0.5"
      exclude_categories:
        description: "Comma-separated categories to skip"
        default: ""
      include_chains:
        description: "Include national chains"
        type: boolean
        default: false
      provinces:
        description: "Comma-separated provinces in load order (empty = all)"
        default: ""
      max_rows:
        description: "Stop after this many rows (0 = no limit)"
        default: "0"

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install duckdb==1.1.3
      - name: Run
        env:
          RELEASE: ${{ inputs.release }}
          MIN_CONFIDENCE: ${{ inputs.min_confidence }}
          EXCLUDE_CATEGORIES: ${{ inputs.exclude_categories }}
          INCLUDE_CHAINS: ${{ inputs.include_chains }}
          PROVINCES: ${{ inputs.provinces }}
          MAX_ROWS: ${{ inputs.max_rows }}
          SCOWT_JOB_TOKEN: ${{ secrets.SCOWT_JOB_TOKEN }}
        run: python scripts/overture_za.py "${{ inputs.mode }}"
